name: Scoped Gate

# Gate remoto y acotado para las tareas de grails-core: corre solo lo que el
# cambio necesita, en vez de la matriz completa de ~60 jobs del repo.
#
# Los "cierre" completos son el perfil `gate`, que reparte los lanes como jobs
# en paralelo (estilo, análisis, RAT, validaciones y core) con --rerun-tasks.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Rama, tag o SHA de MartinJesusDev/grails-core"
        required: true
      profile:
        description: "Qué validar"
        type: choice
        default: module
        options: [module, core, suite, all-suites, analyze, validate, buildhealth, docs, subbuild, fix, task, gate]
      modules:
        description: "module: proyectos Gradle, p.ej. ':grails-views-gson :grails-core'"
        default: ""
      extra:
        description: "Tareas/argumentos extra de Gradle (se añaden al final; sin ; | & $ ` < > \\)"
        default: ""
      tasks:
        description: "task: tareas completas a ejecutar; subbuild: sobreescribe las tareas por defecto del build anidado"
        default: ""
      jdk:
        description: "JDK (21 por defecto; 25 para el island Micronaut)"
        type: choice
        default: "21"
        options: ["21", "25"]
      dir:
        description: "subbuild: build anidado"
        type: choice
        default: grails-forge
        options: [build-logic, grails-gradle, grails-forge, end-to-end]

run-name: "gate [${{ inputs.profile }}] ${{ inputs.ref }} ${{ inputs.modules }} ${{ inputs.profile == 'subbuild' && inputs.dir || '' }} ${{ inputs.tasks }}"

concurrency:
  # Perfiles distintos de la misma rama corren en paralelo; el mismo perfil en
  # la misma rama se serializa (y un tercero cancelaría al que espera).
  group: gate-${{ inputs.ref }}-${{ inputs.profile }}-${{ inputs.dir }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scoped:
    name: "${{ inputs.profile }}"
    if: ${{ inputs.profile != 'analyze' && inputs.profile != 'gate' && inputs.profile != 'all-suites' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
        with:
          ref: ${{ inputs.ref }}
          jdk: ${{ inputs.jdk }}
      - name: Run gate
        env:
          REF: ${{ inputs.ref }}
          PROFILE: ${{ inputs.profile }}
          MODULES: ${{ inputs.modules }}
          TASKS: ${{ inputs.tasks }}
          EXTRA: ${{ inputs.extra }}
          SUBDIR: ${{ inputs.dir }}
        run: ./.github/scripts/gate.sh
      - name: Reports on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: reports-${{ github.run_id }}-${{ inputs.profile }}
          path: |
            grails-core/**/build/reports/violations/**
            grails-core/**/build/test-results/**
            grails-core/grails-test-report/build/reports/**
          retention-days: 7
          if-no-files-found: ignore
      - name: Changes patch (fixers)
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: changes-${{ github.run_id }}-${{ inputs.profile }}
          path: changes.patch
          retention-days: 14
          if-no-files-found: ignore
      - name: Gate status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/status
        with:
          profile: ${{ inputs.profile }}
          lane: scoped
          ref: ${{ inputs.ref }}
          result: ${{ job.status }}

  all-suites:
    name: "suite: ${{ matrix.lane }}"
    if: ${{ inputs.profile == 'all-suites' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        # Una lane por suite especializada; réplica de los jobs equivalentes
        # de .github/workflows/gradle.yml.
        lane: [functional, hibernate5, hibernate7, mongodb, redis, neo4j, springsecurity]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
        with:
          ref: ${{ inputs.ref }}
          jdk: ${{ inputs.jdk }}
      - name: Run gate
        env:
          REF: ${{ inputs.ref }}
          PROFILE: all-suites
          LANE: ${{ matrix.lane }}
          MODULES: ${{ inputs.modules }}
          TASKS: ${{ inputs.tasks }}
          EXTRA: ${{ inputs.extra }}
        run: ./.github/scripts/gate.sh
      - name: Reports on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: reports-${{ github.run_id }}-suite-${{ matrix.lane }}
          path: |
            grails-core/**/build/reports/violations/**
            grails-core/**/build/test-results/**
            grails-core/grails-test-report/build/reports/**
          retention-days: 7
          if-no-files-found: ignore
      - name: Changes patch (fixers)
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: changes-${{ github.run_id }}-suite-${{ matrix.lane }}
          path: changes.patch
          retention-days: 14
          if-no-files-found: ignore
      - name: Gate status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/status
        with:
          profile: ${{ inputs.profile }}
          lane: ${{ matrix.lane }}
          ref: ${{ inputs.ref }}
          result: ${{ job.status }}

  analyze:
    name: "analyze: ${{ matrix.lane }}"
    if: ${{ inputs.profile == 'analyze' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        lane: [style, analysis, rat]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
        with:
          ref: ${{ inputs.ref }}
          jdk: ${{ inputs.jdk }}
      - name: Run gate
        env:
          REF: ${{ inputs.ref }}
          PROFILE: analyze
          LANE: ${{ matrix.lane }}
          MODULES: ${{ inputs.modules }}
          TASKS: ${{ inputs.tasks }}
          EXTRA: ${{ inputs.extra }}
        run: ./.github/scripts/gate.sh
      - name: Reports on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: reports-${{ github.run_id }}-${{ matrix.lane }}
          path: |
            grails-core/**/build/reports/violations/**
            grails-core/**/build/test-results/**
            grails-core/grails-test-report/build/reports/**
          retention-days: 7
          if-no-files-found: ignore
      - name: Changes patch (fixers)
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: changes-${{ github.run_id }}-${{ matrix.lane }}
          path: changes.patch
          retention-days: 14
          if-no-files-found: ignore
      - name: Gate status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/status
        with:
          profile: ${{ inputs.profile }}
          lane: ${{ matrix.lane }}
          ref: ${{ inputs.ref }}
          result: ${{ job.status }}

  gate:
    name: "gate: ${{ matrix.lane }}"
    if: ${{ inputs.profile == 'gate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        lane: [style, analysis, rat, validate, core]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
        with:
          ref: ${{ inputs.ref }}
          jdk: ${{ inputs.jdk }}
      - name: Run gate
        env:
          REF: ${{ inputs.ref }}
          PROFILE: gate
          LANE: ${{ matrix.lane }}
          MODULES: ${{ inputs.modules }}
          TASKS: ${{ inputs.tasks }}
          EXTRA: ${{ inputs.extra }}
        run: ./.github/scripts/gate.sh
      - name: Reports on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: reports-${{ github.run_id }}-gate-${{ matrix.lane }}
          path: |
            grails-core/**/build/reports/violations/**
            grails-core/**/build/test-results/**
            grails-core/grails-test-report/build/reports/**
          retention-days: 7
          if-no-files-found: ignore
      - name: Changes patch (fixers)
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: changes-${{ github.run_id }}-gate-${{ matrix.lane }}
          path: changes.patch
          retention-days: 14
          if-no-files-found: ignore
      - name: Gate status
        if: always()
        continue-on-error: true
        uses: ./.github/actions/status
        with:
          profile: ${{ inputs.profile }}
          lane: ${{ matrix.lane }}
          ref: ${{ inputs.ref }}
          result: ${{ job.status }}

  status:
    name: "status"
    needs: [scoped, all-suites, analyze, gate]
    if: always()
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download lane status
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: status-*
          path: statuses
          merge-multiple: true
          if-no-files-found: ignore
      - name: Merge status.json
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(statuses/*.json)
          if ((${#files[@]})); then
            jq -s 'map(if type == "array" then .[] else . end) | sort_by(.profile, .lane)' "${files[@]}" > status.json
          else
            echo '[]' > status.json
          fi

          {
            echo "## Resultado del gate"
            echo
            if jq -e 'length > 0' status.json >/dev/null; then
              echo "| Lane | Perfil | Resultado |"
              echo "|---|---|---|"
              jq -r '.[] | "| \(.lane) | \(.profile) | \(.conclusion) |"' status.json
            else
              echo "_Sin status.json de las lanes (job cancelado o fallo antes del paso de estado)._"
            fi
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/status-summary.md"
          cat "$RUNNER_TEMP/status-summary.md" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/status-summary.md"
      - name: Upload status.json
        uses: actions/upload-artifact@v7.0.1
        with:
          name: status
          path: status.json
          retention-days: 7
          overwrite: true
          if-no-files-found: error
