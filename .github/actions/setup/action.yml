name: Setup Grails Core

description: >-
  Checkout MartinJesusDev/grails-core at a ref into ./grails-core, install the
  JDK (liberica) and Gradle.

inputs:
  ref:
    description: Branch, tag or SHA of MartinJesusDev/grails-core
    required: true
  jdk:
    description: JDK version (21 by default, 25 for the Micronaut island)
    required: false
    default: "21"

runs:
  using: composite
  steps:
    - name: Checkout grails-core
      uses: actions/checkout@v7.0.1
      with:
        repository: MartinJesusDev/grails-core
        ref: ${{ inputs.ref }}
        path: grails-core
        fetch-depth: 1

    - name: Setup JDK
      uses: actions/setup-java@v6.0.1
      with:
        distribution: liberica
        java-version: ${{ inputs.jdk }}

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      with:
        add-job-summary: on-failure
